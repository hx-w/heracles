services:
  heracles:
    build: .
    image: heracles:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${HERACLES_PORT:-8791}:8791'
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      COACH_MODEL: ${COACH_MODEL:-deepseek-flash}
      COACH_PROVIDER: ${COACH_PROVIDER:-deepseek-official}
      GARMIN_REGION: ${GARMIN_REGION:-cn}
      GARMIN_SYNC_SECONDS: ${GARMIN_SYNC_SECONDS:-300}
    volumes:
      - heracles_data:/data
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  heracles_data:
